<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Saad Anjum, open-source contributor">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a33"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="0.5" stop-color="#bc8cff"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/></pattern>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.16"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
<clipPath id="r"><rect width="1000" height="260" rx="18"/></clipPath>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.name{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;font-weight:800;font-size:60px;letter-spacing:-1px}
.role{font-size:15px;fill:#8b98b8;letter-spacing:3px}
.ty{font-size:22px;fill:#e6edf3;opacity:0;animation-duration:15s;animation-iteration-count:infinite;animation-timing-function:steps(34,end)}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.orb{animation:float 9s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.sw{animation:sweep 6s linear infinite}
@keyframes sweep{from{transform:translateX(-400px)}to{transform:translateX(1000px)}}
.dot{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@keyframes t0{0%,0.00%{clip-path:inset(0 100% 0 0);opacity:1}7.33%,30.00%{clip-path:inset(0 0 0 0);opacity:1}33.33%{clip-path:inset(0 0 0 0);opacity:0}33.34%,100%{clip-path:inset(0 100% 0 0);opacity:0}}
@keyframes t1{0%,33.33%{clip-path:inset(0 100% 0 0);opacity:1}40.67%,63.33%{clip-path:inset(0 0 0 0);opacity:1}66.67%{clip-path:inset(0 0 0 0);opacity:0}66.68%,100%{clip-path:inset(0 100% 0 0);opacity:0}}
@keyframes t2{0%,66.67%{clip-path:inset(0 100% 0 0);opacity:1}74.00%,96.67%{clip-path:inset(0 0 0 0);opacity:1}100.00%{clip-path:inset(0 0 0 0);opacity:0}100.00%,100%{clip-path:inset(0 100% 0 0);opacity:0}}
</style>
<g clip-path="url(#r)">
<rect width="1000" height="260" fill="url(#bg)"/>
<rect width="1000" height="260" fill="url(#grid)"/>
<rect class="sw" y="0" width="400" height="260" fill="url(#sweep)"/>
<g class="orb"><circle cx="860" cy="110" r="90" fill="none" stroke="url(#ac)" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 7"/><circle cx="860" cy="110" r="56" fill="none" stroke="url(#ac)" stroke-opacity="0.5" stroke-width="1.5"/><circle cx="860" cy="110" r="6" fill="#58a6ff"/></g>
<circle class="dot" cx="70" cy="62" r="5" fill="#3fb950"/>
<text class="role" x="86" y="67">OPEN-SOURCE CONTRIBUTOR</text>
<text class="name" x="68" y="140" fill="url(#ac)">Saad Anjum</text>
<text x="52" y="196" font-size="22" fill="#58a6ff">&gt;</text>
<text class="ty" style="animation-name:t0" x="70" y="196">fixing real bugs in tools you use every day</text>
<text class="ty" style="animation-name:t1" x="70" y="196">11 pull requests merged  ·  395k+ stars of reach</text>
<text class="ty" style="animation-name:t2" x="70" y="196">Go  ·  Rust  ·  Python  ·  TypeScript  ·  Shell</text>

<rect class="cur" x="0" y="0" width="0" height="0"/>
</g>
<rect x="1" y="1" width="998" height="258" rx="17" fill="none" stroke="url(#ac)" stroke-opacity="0.45" stroke-width="2"/>
</svg>